# Firebase App Hosting runtime config for the agency-site Next.js app.
# Applies to both agency-site-prod and agency-site-dev backends.
#
# Buildpack autodetects Next.js from package.json. The repo root has
# pnpm-workspace.yaml, so pnpm install/build runs from that root and respects
# the workspace deps. Next.js + Firebase's @apphosting/adapter-nextjs bypasses
# the generic Node launcher's `pnpm install` problem that broke the Astro version.

runConfig:
  # Cost-conscious defaults for a marketing/blog site. Bump minInstances to 1
  # if cold-start latency ever bites — adds ~$5/mo per backend.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Supabase connection. Secret is created via:
  #   firebase apphosting:secrets:set DATABASE_URL --project=aiwebatelier-spine
  # then bound to each backend with apphosting:secrets:grantaccess.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # Supabase Auth (unified identity). URL is public; anon key is publishable but
  # kept as a secret ref. Both must be BUILD-available so Next inlines the
  # NEXT_PUBLIC_* values into the client bundle.
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://owooqqxnuluddvizkrzt.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: supabase-anon-key
    availability:
      - BUILD
      - RUNTIME
  # Server-only — bypasses RLS. Used by brand/job server actions. NEVER public.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: supabase-service-role-key
    availability:
      - RUNTIME
