# CI — runs on every push to main and every PR.
# Fast tests + admin build. The slower design-system quality-checks job runs
# in a separate workflow (ci-design-system.yml) to keep failure isolation clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs of the same ref. The most recent push is the truth.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # @atelier/db, @atelier/shared and @atelier/auth expose only their compiled
      # dist entry (package.json "exports" -> ./dist). admin's vitest resolves
      # them by package entry, so the dist must exist before admin tests run.
      - name: Build workspace deps
        run: pnpm --filter @atelier/db build && pnpm --filter @atelier/shared build && pnpm --filter @atelier/auth build

      - name: Test @atelier/db
        run: pnpm --filter @atelier/db test

      - name: Test @atelier/shared
        run: pnpm --filter @atelier/shared test

      - name: Test admin
        run: pnpm --filter admin test

  build-admin:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm --filter admin build
        env:
          # Build-time placeholders. Admin now uses Supabase Auth (migrated off
          # next-auth). NEXT_PUBLIC_* are inlined into the client bundle at build
          # time, so they must be DEFINED — but the build opens no connection, so
          # placeholder values are fine. Real values come from apps/admin/.env.local
          # locally and from App Hosting secrets in prod.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key
          # The Next.js build doesn't open a real connection; the variable just
          # needs to exist. Tests use pglite (in-process) via getTestDb() — no
          # external Postgres required.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atelier_ci
          SITE_STATUS: preview

  build-agency-site:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # agency-site's own prebuild builds @atelier/auth, but typecheck runs
      # first and needs the dist (.d.ts) to resolve @atelier/auth.
      - name: Build workspace deps
        run: pnpm --filter @atelier/auth build

      - name: Typecheck agency-site
        run: pnpm --filter agency-site typecheck

      - name: Build agency-site
        run: pnpm --filter agency-site build
        env:
          # NEXT_PUBLIC_* are inlined into the bundle at build; placeholders are
          # fine — the build opens no Supabase connection. Real values come from
          # App Hosting secrets (apphosting.yaml) in dev/prod.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key
          SITE_STATUS: preview

  worker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # The worker imports @atelier/db (and transitively @atelier/shared) by
      # package entry (-> dist), so build those before typecheck/test.
      - name: Build workspace deps
        run: pnpm --filter @atelier/db build && pnpm --filter @atelier/shared build

      - name: Typecheck local-worker
        run: pnpm --filter local-worker typecheck

      # Worker tests use pglite (in-process Postgres) — no external DB needed.
      - name: Test local-worker
        run: pnpm --filter local-worker test
